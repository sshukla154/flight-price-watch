name: One-time round-trip API probe (throwaway, delete after use)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python probe_roundtrip.py
