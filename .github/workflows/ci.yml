name: CI

# Validates code changes (lint + tests) -- distinct from daily-check.yml
# and gorakhpur-check.yml, which run the actual product automation. This
# workflow never calls the real SerpApi/CallMeBot APIs (tests mock every
# HTTP call), so it needs none of the three repo secrets.

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests
        run: pytest -v
