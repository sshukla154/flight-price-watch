name: Daily flight price check

on:
  schedule:
    # 06:00 UTC daily. GitHub's own docs note scheduled workflows can slip
    # a few minutes under load -- fine for a once-a-day price check.
    - cron: "0 6 * * *"
  workflow_dispatch: # manual "Run workflow" button, for testing on demand
    inputs:
      outbound_date:
        description: "Override date (YYYY-MM-DD) -- blank uses routes.toml's own default. Use a near-term date to test whether a 'no data yet' result is a real schedule-publication-horizon gap vs. a broken query, or (for DXN specifically) whether SerpApi has picked up the new airport at all."
        required: false
        default: ""

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Compare candidate destinations and notify WhatsApp
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          # Guarded on event_name -- the `inputs` context is only meaningful
          # for a workflow_dispatch trigger; the daily `schedule` trigger
          # must never depend on it existing.
          FLIGHT_OUTBOUND_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.outbound_date || '' }}
        run: python check_flights.py
