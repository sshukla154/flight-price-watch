name: Daily flight price check

on:
  schedule:
    # 06:00 UTC daily. GitHub's own docs note scheduled workflows can slip
    # a few minutes under load -- fine for a once-a-day price check.
    - cron: "0 6 * * *"
  workflow_dispatch: # manual "Run workflow" button, for testing on demand
    inputs:
      outbound_date:
        description: "Override date (YYYY-MM-DD) -- blank uses routes.toml's own default. Use a near-term date to test whether a 'no data yet' result is a real schedule-publication-horizon gap vs. a broken query."
        required: false
        default: ""
      notify_channel:
        description: "Force the notification channel (whatsapp/email) instead of the automatic GITHUB_ACTIONS-based pick -- blank uses the automatic pick. Useful to test the other-channel fallback, or to re-check whether CallMeBot's GitHub Actions IP block has ever lifted."
        required: false
        default: ""
      adults:
        description: "Override adult passenger count -- blank uses routes.toml's own default. Useful to re-verify SerpApi's price field is the TOTAL for the party, not per-adult (compare against a run with this set to 1)."
        required: false
        default: ""
      children:
        description: "Override child passenger count -- blank uses routes.toml's own default."
        required: false
        default: ""

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Compare candidate destinations and notify
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          # CallMeBot's WhatsApp API blocks GitHub Actions' shared runner
          # IP ranges -- confirmed by testing the same key/phone from a
          # home network, where it works fine. check_flights.py's
          # _notify_channel() always picks email here since GITHUB_ACTIONS
          # is set automatically in every job; CALLMEBOT_* above are kept
          # only so this workflow still works if that ever changes.
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # Guarded on event_name -- the `inputs` context is only meaningful
          # for a workflow_dispatch trigger; the daily `schedule` trigger
          # must never depend on it existing.
          FLIGHT_OUTBOUND_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.outbound_date || '' }}
          FLIGHT_NOTIFY_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.notify_channel || '' }}
          FLIGHT_ADULTS: ${{ github.event_name == 'workflow_dispatch' && inputs.adults || '' }}
          FLIGHT_CHILDREN: ${{ github.event_name == 'workflow_dispatch' && inputs.children || '' }}
        run: python check_flights.py
