# routes.toml -- the ONE file to edit for route/date/candidate changes.
#
# Nothing secret in here (secrets are SERPAPI_KEY/CALLMEBOT_PHONE/
# CALLMEBOT_APIKEY, GitHub Actions repo secrets, never in this file).
#
# daily-check.yml's FLIGHT_OUTBOUND_DATE env-var override (used for
# one-off workflow_dispatch diagnostic runs, e.g. testing a near-term
# date) still takes precedence over these values when set -- see
# check_flights.py's own comments.
#
# See README.md's "Airports considered" table for the full reasoning
# behind which candidates are active here vs. dropped (GOP, KBK, KNU).

[check_flights]
departure_id = "AMS"
departure_label = "Amsterdam"
outbound_date = "2027-07-22"
# Round trip -- return_after_days is computed against outbound_date at
# runtime, not stored as a second hardcoded date, so it never drifts
# out of sync when outbound_date changes. Days, not weeks, so an exact
# target return date (here: 2027-08-29) can be hit precisely.
return_after_days = 38
currency = "EUR"
adults = 2
children = 1
# one_stop = true means "also compute/show a 1-STOP (one layover)
# result for this candidate" -- reserved for major hubs where a
# one-layover itinerary is a meaningful comparison. false means
# DIRECT-only, deliberately: a one-stop itinerary all the way into a
# near-destination airport (VNS/LKO/DXN) isn't what "1 stop" means for
# this trip -- see README's "Airports considered" table.
candidates = [
    { id = "DEL", label = "Delhi", one_stop = true },
    { id = "BOM", label = "Mumbai", one_stop = true },
    { id = "VNS", label = "Varanasi", one_stop = false },
    { id = "LKO", label = "Lucknow", one_stop = false },
    { id = "DXN", label = "Noida (Jewar)", one_stop = false },
]

# Opt-in itinerary filtering -- absent/empty by default, so nothing
# changes unless a list here is actually populated. All four lists
# are HARD filters except preferred_airlines (soft: score bonus only,
# never excludes). excluded_layover_regions/required_layover_regions
# have NO fallback if they empty a category's pool -- that category
# just produces no row, same as any other "nothing useful to report"
# case. required_airlines DOES fall back (to the region-filtered pool,
# annotated as such) if the allow-list matches nothing, rather than
# going blank.
[check_flights.filters]
preferred_airlines = []
required_airlines = []
excluded_layover_regions = []
required_layover_regions = []

# Deliberately incomplete -- extend by hand as new layover airports
# show up, same workflow as editing candidates above. Every region
# name used in excluded_layover_regions/required_layover_regions must
# be a key defined here (validated at import time in check_flights.py).
[check_flights.filters.layover_regions]
middle_east = ["MCT", "DXB", "AUH", "DOH", "AMM", "CAI", "JED", "RUH", "BAH", "KWI"]
europe_uk   = ["LHR", "LGW", "AMS", "CDG", "FRA", "MUC", "IST"]
